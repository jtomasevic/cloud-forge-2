openapi: "3.0.3"

info:
  title: CF-Provisioner
  version: "1.0.0"
  description: >
    CF-Provisioner is the infrastructure provisioning and lifecycle engine for
    CloudForge. It creates and manages tenant vCluster instances, CIDR allocations,
    Cilium network policies, kubeconfigs, and internet gateways.
  contact:
    name: CloudForge Platform Team
    url: https://github.com/jtomasevic/cloud-forge-2

servers:
  - url: http://localhost:8082
    description: Local development

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    InternalSecret:
      type: apiKey
      in: header
      name: X-CF-Internal-Secret
      description: >
        Shared secret for internal control-plane calls only. CF-Provisioner is not
        exposed to tenants; all operations require this header.

  schemas:
    ProvisionNetworkRequest:
      type: object
      required: [region]
      properties:
        networkId:
          type: string
          format: uuid
          description: >
            Optional network identifier for callers that already created a
            CloudForge network record. If omitted, CF-Provisioner generates one.
        tenantId:
          type: string
          format: uuid
          description: >
            Tenant that owns the network. When requests arrive through
            CF-Router this is normally supplied by trusted X-CF-Tenant-ID
            headers, so public callers do not need to send it.
        region:
          type: string
        podCIDRPrefix:
          type: string
          description: >
            Optional CIDR prefix to use. If omitted, auto-allocated from the platform supernet.
        svcCIDRPrefix:
          type: string
          description: Optional service CIDR prefix.

    NetworkProvisioningStatus:
      type: object
      required: [networkId, tenantId, status, podCIDR, svcCIDR, createdAt]
      properties:
        networkId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        status:
          type: string
          enum: [provisioning, active, deprovisioning, deprovisioned, failed]
        podCIDR:
          type: string
        svcCIDR:
          type: string
        vclusterName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        failureReason:
          type: string
          nullable: true

    ProvisionGatewayRequest:
      type: object
      required: [publicDNSName]
      properties:
        publicDNSName:
          type: string
          description: >
            The public DNS name to expose (e.g. tenant-abc.gateway.cloudforge.io).
        tlsEnabled:
          type: boolean
          default: true

    GatewayStatus:
      type: object
      required: [networkId, status, publicEndpoint]
      properties:
        networkId:
          type: string
          format: uuid
        status:
          type: string
          enum: [provisioning, active, removing, removed, failed]
        publicEndpoint:
          type: string
          nullable: true
        httpRouteName:
          type: string
        createdAt:
          type: string
          format: date-time

    AppServiceRuntime:
      type: object
      required: [serviceType, resources]
      description: >
        Runtime declaration for a CloudForge app service. The MVP supports
        immutable image references and local-development Docker builds; exactly
        one of `image` or `build` must be supplied by callers. Production callers
        should prefer immutable registry image tags or digests.
      properties:
        serviceType:
          type: string
          enum: [rest, grpc, ui, worker, tcp, container]
          description: >
            Workload shape. `rest`, `grpc`, `ui`, and `tcp` services can declare
            ports. `worker` services may declare no ports and cannot be exposed
            through an internet gateway.
        image:
          type: string
          description: >
            Container image reference to deploy. Production usage should pass an
            immutable tag or digest. Either `image` or `build` is required.
        build:
          $ref: "#/components/schemas/AppServiceBuild"
        command:
          type: array
          items:
            type: string
          description: Optional container entrypoint override.
        args:
          type: array
          items:
            type: string
          description: Optional container command arguments.
        resources:
          $ref: "#/components/schemas/AppServiceResources"
        env:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/AppServiceEnvVar"
        ports:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/AppServicePort"
        replicas:
          type: integer
          minimum: 1
          default: 1
          description: Desired replica count. The MVP may cap this to one.

    AppServiceBuild:
      type: object
      required: [context, dockerfile]
      description: >
        Local-development Docker build metadata. Production control-plane callers
        should pass a registry `image` instead of arbitrary build context until a
        secure build service exists.
      properties:
        context:
          type: string
          description: Build context path or source reference understood by the caller/build adapter.
        dockerfile:
          type: string
          default: Dockerfile
          description: Dockerfile path relative to `context`.
        target:
          type: string
          description: Optional Docker build target stage.
        args:
          type: object
          additionalProperties:
            type: string
          description: Optional Docker build arguments.

    AppServiceResources:
      type: object
      required: [cpu, memory]
      description: >
        Required resource limits for multi-tenant safety. If a later platform
        plan allows omitted values, CF-Provisioner must fill explicit defaults
        before creating Kubernetes workloads.
      properties:
        cpu:
          type: string
          description: CPU request/limit such as `250m`, `500m`, or `1`.
        memory:
          type: string
          description: Memory request/limit such as `256Mi`, `512Mi`, or `1Gi`.

    AppServiceEnvVar:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        value:
          type: string
          description: Plaintext value. Use `secretRef` for values that must not be stored inline.
        secretRef:
          type: string
          description: Optional secret reference resolved by a future secret adapter.

    AppServicePort:
      type: object
      required: [name, containerPort, protocol]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
          description: Stable port name used by exposure `portRef`.
        containerPort:
          type: integer
          minimum: 1
          maximum: 65535
        protocol:
          type: string
          enum: [HTTP, GRPC, TCP]
          description: >
            MVP public routing supports HTTP through Gateway API HTTPRoute.
            GRPC and TCP exposure must be rejected until a compatible route and
            documentation adapter exist.

    AppServiceSwagger:
      type: object
      required: [publicPath, openapiPath]
      anyOf:
        - required: [specUrl]
        - required: [inlineSpec]
      description: >
        Public documentation metadata required for every app service exposed
        through an internet gateway. HTTP/REST services must provide either a
        reachable OpenAPI document URL or an inline OpenAPI document. If a
        protocol cannot provide an OpenAPI-compatible document yet, internet
        gateway exposure must be rejected until a protocol-specific documentation
        adapter exists.
      properties:
        specUrl:
          type: string
          format: uri
          description: URL where CF can fetch the service OpenAPI document.
        inlineSpec:
          type: object
          additionalProperties: true
          description: Inline OpenAPI document object.
        publicPath:
          type: string
          default: /swagger/
          description: Public Swagger UI path routed for the exposed service.
        openapiPath:
          type: string
          default: /openapi.json
          description: Public OpenAPI JSON path routed for the exposed service.

    AppServiceExposure:
      type: object
      required: [type, host, portRef, swagger]
      description: >
        Explicit internet gateway exposure request. Public subnet placement only
        makes an app service eligible for public routing; it does not create a
        public route by itself. Private subnet app services must be rejected when
        this exposure is requested. `portRef` must reference one of the declared
        runtime ports, the network must have an active internet gateway, and
        public documentation metadata is mandatory.
      properties:
        type:
          type: string
          enum: [InternetGateway]
        host:
          type: string
          description: Public hostname to route through the internet gateway.
        portRef:
          type: string
          description: Runtime port name to expose. Must match `runtime.ports[].name`.
        tlsEnabled:
          type: boolean
          default: true
        swagger:
          $ref: "#/components/schemas/AppServiceSwagger"

    AppServiceStatus:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [creating, running, updating, deleting, failed]
        desiredReplicas:
          type: integer
          minimum: 0
        readyReplicas:
          type: integer
          minimum: 0
        internalDNSName:
          type: string
          description: DNS name reachable inside the tenant private network.
        publicEndpoint:
          type: string
          nullable: true
          description: Public URL when internet gateway exposure is active.
        failureReason:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    AppService:
      type: object
      required: [id, networkId, subnetId, name, runtime, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        networkId:
          type: string
          format: uuid
        subnetId:
          type: string
          format: uuid
          description: >
            Subnet where the app service is placed. The subnet must exist, must
            belong to `networkId`, and its public/private type controls whether
            internet gateway exposure can be requested.
        name:
          type: string
          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
        runtime:
          $ref: "#/components/schemas/AppServiceRuntime"
        exposure:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AppServiceExposure"
        status:
          $ref: "#/components/schemas/AppServiceStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAppServiceRequest:
      type: object
      required: [name, subnetId, runtime]
      description: >
        Creates an app service in an active private network. CF-Provisioner must
        validate that the network is active, that `subnetId` exists and belongs
        to the path `networkId`, that resource limits are present, and that any
        requested internet gateway exposure targets a declared runtime port and
        a public subnet. Public subnet placement alone never creates public
        exposure.
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
        subnetId:
          type: string
          format: uuid
        runtime:
          $ref: "#/components/schemas/AppServiceRuntime"
        exposure:
          $ref: "#/components/schemas/AppServiceExposure"

    AppServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppService"

    Job:
      type: object
      required: [id, networkId, type, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        networkId:
          type: string
          format: uuid
        appServiceId:
          type: string
          format: uuid
          description: App service affected by this job, when the job type is app-service related.
        type:
          type: string
          enum:
            - provision_network
            - deprovision_network
            - provision_gateway
            - remove_gateway
            - provision_subnet
            - create_app_service
            - delete_app_service
            - expose_app_service
            - remove_app_service_exposure
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"

    Subnet:
      type: object
      required: [id, networkId, type, cidr]
      properties:
        id:
          type: string
          format: uuid
        networkId:
          type: string
          format: uuid
        type:
          type: string
          enum: [private, public]
        cidr:
          type: string
        zone:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateSubnetRequest:
      type: object
      required: [type, cidr]
      properties:
        type:
          type: string
          enum: [private, public]
        cidr:
          type: string
        zone:
          type: string
          description: Optional availability zone or placement hint for the subnet.

    SubnetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Subnet"

    CIDRAllocation:
      type: object
      required: [networkId, podCIDR, svcCIDR, allocatedAt]
      properties:
        networkId:
          type: string
          format: uuid
        podCIDR:
          type: string
        svcCIDR:
          type: string
        allocatedAt:
          type: string
          format: date-time

    CIDRAllocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CIDRAllocation"

    Error:
      type: object
      description: Standard error response returned for all 4xx and 5xx responses.
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. "NOT_FOUND".
        message:
          type: string
          description: Human-readable error description.
        requestId:
          type: string
          description: >
            Correlation ID from the X-Request-ID header, echoed back for
            tracing across service boundaries.

  parameters:
    networkId:
      name: networkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique network identifier.
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique async job identifier.
    appServiceId:
      name: appServiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique app service identifier.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items to return (1–100, default 20).
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based offset of the first item to return (default 0).

  responses:
    BadRequest:
      description: Request payload failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid X-CF-Internal-Secret.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: An unexpected error occurred inside the service.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: The route is defined in the contract but not implemented by this service build yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >
        The request was well-formed but could not be applied (for example
        provisioning preconditions or dependency failures).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

tags:
  - name: Networks
    description: Tenant private network provisioning and lifecycle.
  - name: Gateways
    description: Internet gateway (Envoy Gateway HTTPRoute + Cilium) lifecycle.
  - name: Jobs
    description: Async provisioning job status and listing.
  - name: Subnets
    description: Subnets within a provisioned network.
  - name: AppServices
    description: Application workload services deployed into tenant private networks.
  - name: CIDR
    description: Internal CIDR allocation visibility for operators.

security:
  - InternalSecret: []

paths:
  /v1/networks:
    post:
      operationId: provisionNetwork
      summary: Provision a tenant private network
      description: >
        Starts asynchronous provisioning of a new tenant private network: vCluster
        creation, CIDR allocation, Cilium policies, and kubeconfig storage.
        Returns **202 Accepted** immediately with a `Job` whose `id` is the async
        job handle. Poll `GET /v1/jobs/{jobId}` until `status` is `succeeded` or
        `failed`, then read final state with `GET /v1/networks/{networkId}`.
      tags: [Networks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionNetworkRequest"
      responses:
        "202":
          description: Provisioning accepted; job created for background work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/networks/{networkId}:
    parameters:
      - $ref: "#/components/parameters/networkId"
    get:
      operationId: getNetworkProvisioningStatus
      summary: Get network provisioning status
      description: Returns the current provisioning state and CIDRs for a network.
      tags: [Networks]
      responses:
        "200":
          description: Current network provisioning status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkProvisioningStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deprovisionNetwork
      summary: Deprovision a network
      description: >
        Starts asynchronous teardown of the network (vCluster destroy, CIDR free,
        kubeconfig removal). Returns **202 Accepted** with a `Job` representing the
        deprovision workflow. Poll `GET /v1/jobs/{jobId}` until completion.
      tags: [Networks]
      responses:
        "202":
          description: Deprovisioning accepted; job created for background work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/networks/{networkId}/gateway:
    parameters:
      - $ref: "#/components/parameters/networkId"
    post:
      operationId: provisionGateway
      summary: Provision an internet gateway for a network
      description: >
        Starts asynchronous gateway wiring: Envoy Gateway HTTPRoute and Cilium ingress policy.
        Returns **202 Accepted** with a `Job` handle; poll `GET /v1/jobs/{jobId}` until completion,
        then read `GET /v1/networks/{networkId}/gateway`.
      tags: [Gateways]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionGatewayRequest"
      responses:
        "202":
          description: Gateway provisioning accepted; job created for background work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      operationId: getGatewayStatus
      summary: Get internet gateway status
      tags: [Gateways]
      responses:
        "200":
          description: Current gateway status for the network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: removeGateway
      summary: Remove the internet gateway
      description: >
        Starts asynchronous removal of the Envoy Gateway HTTPRoute and related Cilium ingress policy.
        Returns **202 Accepted** with a `Job` handle; poll `GET /v1/jobs/{jobId}` until completion.
      tags: [Gateways]
      responses:
        "202":
          description: Gateway removal accepted; job created for background work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/jobId"
    get:
      operationId: getJob
      summary: Get async job status
      description: Returns status for a provisioning job returned from async operations.
      tags: [Jobs]
      responses:
        "200":
          description: Job record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/networks/{networkId}/jobs:
    parameters:
      - $ref: "#/components/parameters/networkId"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/offset"
    get:
      operationId: listNetworkJobs
      summary: List jobs for a network
      tags: [Jobs]
      responses:
        "200":
          description: Jobs associated with the network, newest first (implementation-defined order).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/networks/{networkId}/subnets:
    parameters:
      - $ref: "#/components/parameters/networkId"
    post:
      operationId: createSubnet
      summary: Create a subnet in a network
      tags: [Subnets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubnetRequest"
      responses:
        "201":
          description: Subnet created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subnet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      operationId: listSubnets
      summary: List subnets in a network
      tags: [Subnets]
      responses:
        "200":
          description: Subnets belonging to the network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubnetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/networks/{networkId}/app-services:
    parameters:
      - $ref: "#/components/parameters/networkId"
    post:
      operationId: createAppService
      summary: Create an app service in a network
      description: >
        Starts asynchronous creation of a CloudForge app service inside an active
        private network. The target subnet must exist and belong to `networkId`.
        Private subnet placement is always internal-only; public subnet placement
        only makes the service eligible for internet gateway exposure and does
        not create a public route by itself. If `exposure.type` is
        `InternetGateway`, the subnet must be public, `portRef` must reference a
        declared runtime port, and Swagger/OpenAPI documentation metadata is
        required before a public route may be created.
      tags: [AppServices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppServiceRequest"
      responses:
        "202":
