  /v1/app-services/{appServiceId}:
    parameters:
      - $ref: "#/components/parameters/appServiceId"
    get:
      operationId: getAppService
      summary: Get app service status
      description: Returns runtime, placement, exposure, and readiness status for one app service.
      tags: [AppServices]
      responses:
        "200":
          description: App service record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppService"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteAppService
      summary: Delete an app service
      description: >
        Starts asynchronous deletion of the workload, internal service, optional
        public route, and related Cilium policy. Returns a `Job` that callers
        poll until completion.
      tags: [AppServices]
      responses:
        "202":
          description: App service deletion accepted; job created for background work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
