  /v1/app-services/{appServiceId}/exposure:
    parameters:
      - $ref: "#/components/parameters/appServiceId"
    post:
      operationId: exposeAppService
      summary: Expose an app service through an internet gateway
      description: >
        Starts asynchronous internet gateway exposure for an existing app
        service. The app service must be placed in a public subnet; private
        subnet services must be rejected. The exposed `portRef` must reference a
        declared runtime port. Swagger/OpenAPI documentation metadata is
        mandatory so every public service has a discoverable public Swagger page
        and OpenAPI document. HTTP/REST is the MVP public protocol; protocols
        without a documentation adapter must be rejected.
      tags: [AppServices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppServiceExposure"
      responses:
        "202":
          description: Exposure accepted; job created for background work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: removeAppServiceExposure
      summary: Remove app service internet gateway exposure
      description: >
        Starts asynchronous removal of the public route and related ingress
        policy while leaving the app service running inside the private network.
      tags: [AppServices]
      responses:
        "202":
          description: Exposure removal accepted; job created for background work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/NotImplemented"

