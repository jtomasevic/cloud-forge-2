version: "3.9"

services:
  scylladb:
    image: scylladb/scylla:5.4
    container_name: cloudforge-scylladb
    ports:
      - "9042:9042"
      - "9160:9160"
    command:
      ["--smp", "1", "--memory", "512M", "--overprovisioned", "1", "--developer-mode", "1"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - scylladb-data:/var/lib/scylla
    networks:
      - cloudforge

  openbao:
    image: openbao/openbao:2.0.0
    container_name: cloudforge-openbao
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      BAO_DEV_ROOT_TOKEN_ID: "dev-root-token"
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: ["server", "-dev", "-dev-root-token-id=dev-root-token", "-dev-listen-address=0.0.0.0:8200"]
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cloudforge

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: cloudforge-keycloak
    ports:
      - "8084:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
    command:
      - "start-dev"
      - "--import-realm"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cloudforge

volumes:
  scylladb-data:

networks:
  cloudforge:
    driver: bridge
