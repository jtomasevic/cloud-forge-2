apiVersion: apps/v1
kind: Deployment
metadata:
  name: cf-router
  namespace: cloudforge-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cf-router
  template:
    metadata:
      labels:
        app: cf-router
    spec:
      containers:
        - name: cf-router
          image: ghcr.io/jtomasevic/cloud-forge-2/cf-router
          ports:
            - name: http
              containerPort: 8083
            - name: swagger
              containerPort: 8090
          env:
            - name: HTTP_ADDR
              value: ":8083"
            - name: SWAGGER_ADDR
              value: ":8090"
            - name: SCYLLADB_HOSTS
              value: "host.k3d.internal:9042"
            - name: SCYLLADB_KEYSPACE
              value: "cloudforge"
            - name: CF_ACCOUNTS_URL
              value: "http://cf-accounts:8081"
            - name: CF_PROVISIONER_URL
              value: "http://cf-provisioner:8082"
            - name: CF_INTERNAL_SECRET
              value: "dev-internal-secret"
            - name: KEYCLOAK_JWKS_URL
              value: "http://host.k3d.internal:8084/auth/realms/cloudforge/protocol/openid-connect/certs"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:8090,http://127.0.0.1:8090"
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cf-router
  namespace: cloudforge-control-plane
spec:
  selector:
    app: cf-router
  ports:
    - name: http
      port: 8083
      targetPort: 8083
    - name: swagger
      port: 8090
      targetPort: 8090
